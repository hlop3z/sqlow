[project]
name = "sqlow"
version = "0.4.0"
description = "SQLite for dataclasses. JSON-file simplicity, typed records, zero boilerplate. No ORM. No migrations. Stdlib only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "hlop3z", email = "23062270+hlop3z@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `task fmt` runs isort after black, so without this isort rewraps long import
# lines in a style black and ruff both reject.
[tool.isort]
profile = "black"

[dependency-groups]
dev = [
    # Dev Tools
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    # Lint
    "black>=26.3.1",
    "isort>=8.0.1",
    "mypy>=2.0.0",
    "pylint>=4.0.5",
    "ruff>=0.15.12",
    "ssort>=0.16.0",
]
